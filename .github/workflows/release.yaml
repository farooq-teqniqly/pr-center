name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish:
    name: Publish (${{ matrix.rid }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      matrix:
        rid: [win-x64, osx-x64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 10.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish self-contained (${{ matrix.rid }})
        run: |
          dotnet publish src/PrCenter.Web/PrCenter.Web.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained true \
            -o publish/${{ matrix.rid }}

      - name: Zip artifact
        run: |
          cd publish/${{ matrix.rid }}
          zip -r ../../PrCenter.Web-${{ github.ref_name }}-${{ matrix.rid }}.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrCenter.Web-${{ github.ref_name }}-${{ matrix.rid }}
          path: PrCenter.Web-${{ github.ref_name }}-${{ matrix.rid }}.zip

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: publish
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
