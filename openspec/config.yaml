schema: spec-driven

# Keep this short. It is a pointer, not a copy.
#
# Everything about stack, code conventions, testing, build, commits, and writing
# style lives in CLAUDE.md (which imports CLAUDE-baseline.md). Claude Code loads
# both automatically every session, so restating them here bought nothing but a
# second place to drift -- and it did drift: this file and CLAUDE.md both carried
# a "mark-as-seen happens on click-through" invariant for weeks after
# replace-marker-with-review-baseline deleted the concept.
#
# Add a rule to CLAUDE.md. Add it here only if OpenSpec artifacts need it and
# nothing else does, and then put it under `rules:`, not in this context blob.
context: |
  PR-Center: single-user, self-hosted "review inbox" for GitHub PRs awaiting the
  user's review across orgs (PerfectServe, ps-unite) and a personal account
  (farooq-teqniqly). Read-only projection of GitHub state -- never mutates PRs.
  ASP.NET Core on net10.0 with a Blazor Server frontend, EF Core + SQLite on a
  mounted volume, GitHub REST/GraphQL called directly. Runs in Podman/Docker on
  a workstation.

  Read before proposing or designing anything:
  - CLAUDE.md and CLAUDE-baseline.md -- conventions, code style, testing, build,
    commits, PR and merge rules. Authoritative; do not restate them in artifacts.
  - docs/pr-center-idea.md -- product concept. Its Key Decisions win conflicts.
  - docs/pr-center-state.md -- derived state machines.
  - docs/pr-center-architecture.md -- project boundaries and dependency direction.
  - openspec/specs/ -- what already ships. Check here before asserting current
    behavior; the specs are the record, this file is not.

  The design invariants in CLAUDE.md ("Design invariants") are binding on every
  artifact. Do not violate one without updating the idea and state docs first.

rules:
  proposal:
    - Keep scope aligned with docs/pr-center-idea.md v1 scope; call out any
      deviation from a Key Decision explicitly.
    - Include a "Non-goals" section.
  design:
    - Verify inference-based decisions against source docs/code before recording
      them; mark unverified assumptions as open questions.
    - Respect the design invariants in CLAUDE.md.
    - When implementation simplifies away a component or step this design named,
      update the design to match what shipped and say why, rather than leaving
      the doc describing a structure the code does not have.
  specs:
    - State requirements relative to the user only (never another reviewer's
      perspective).
    - Spec the behavior that shipped, including hardening added during review --
      a spec that understates the guarantee is drift.
  tasks:
    - "Follow TDD ordering: failing test first, then implementation, then
      refactor."
    - Wait for explicit approval before committing, per the commit rule in
      CLAUDE.md.
